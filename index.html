    <style>
      html, body, #root {
        background: #020204;
      }
      #root {
        opacity: 0;
        transition: opacity 860ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #root.cv-mounted {
        opacity: 1;
      }
      body {
        margin: 0;
      }
      #cv-pre-mount-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #020204;
        transition: opacity 900ms cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
      }
      #cv-pre-mount-splash::before {
        content: "";
        position: absolute;
        width: min(72vw, 420px);
        height: min(72vw, 420px);
        border-radius: 999px;
        background: radial-gradient(circle, rgba(139, 92, 246, 0.16) 0%, rgba(59, 130, 246, 0.08) 34%, rgba(2, 2, 4, 0) 69%);
        filter: blur(16px);
        animation: cv-premount-aura 2.6s ease-in-out infinite;
      }
      #cv-pre-mount-splash::after {
        content: "";
        position: absolute;
        width: min(48vw, 260px);
        height: min(48vw, 260px);
        border-radius: 999px;
        border: 1px solid rgba(139, 92, 246, 0.34);
        box-shadow: 0 0 24px rgba(124, 58, 237, 0.24), 0 0 40px rgba(59, 130, 246, 0.14);
        animation: cv-premount-ring 2.8s ease-in-out infinite;
      }
      .cv-pre-mount-logo-wrap {
        position: relative;
        width: min(36vw, 168px);
        height: min(36vw, 168px);
        display: grid;
        place-items: center;
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.01));
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.45),
          0 0 0 1px rgba(139, 92, 246, 0.14) inset,
          0 0 28px rgba(124, 58, 237, 0.12);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .cv-pre-mount-logo-wrap::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(120deg, rgba(255, 255, 255, 0) 25%, rgba(255, 255, 255, 0.1) 50%, rgba(255, 255, 255, 0) 75%);
        transform: translateX(-120%);
        animation: cv-premount-shimmer 3.8s ease-in-out infinite;
        pointer-events: none;
      }
      #cv-pre-mount-splash img {
        width: min(26vw, 116px);
        height: min(26vw, 116px);
        object-fit: contain;
        position: relative;
        z-index: 1;
        animation: cv-premount-logo 2.4s ease-in-out infinite;
      }
      #cv-pre-mount-splash.cv-hide {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes cv-premount-logo {
        0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.2)); }
        50% { transform: translateY(-1px) scale(1.02); filter: drop-shadow(0 0 14px rgba(59, 130, 246, 0.26)); }
      }
      @keyframes cv-premount-ring {
        0%, 100% { transform: scale(0.97); opacity: 0.42; }
        50% { transform: scale(1.02); opacity: 0.68; }
      }
      @keyframes cv-premount-aura {
        0%, 100% { transform: scale(0.96); opacity: 0.5; }
        50% { transform: scale(1.04); opacity: 0.75; }
      }
      @keyframes cv-premount-shimmer {
        0%, 100% { transform: translateX(-120%); opacity: 0; }
        35% { opacity: 1; }
        65% { transform: translateX(120%); opacity: 0.65; }
      }
    </style>
